<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手写数字识别 · MLP 实时测试</title>
<style>
  :root{
    --bg:#f5f6f7; --card:#ffffff; --line:#e3e5e8; --text:#1d1f21;
    --muted:#6b7075; --accent:#185FA5; --accent-soft:#e6f1fb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;}
  .wrap{max-width:880px;margin:0 auto;padding:32px 20px 48px}
  header{margin-bottom:24px}
  h1{font-size:19px;font-weight:600;margin:0 0 6px}
  header p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
  header a{color:var(--muted);font-size:12px}
  main{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
  @media (max-width:720px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  #board{width:280px;height:280px;display:block;border-radius:8px;background:#fff;
    touch-action:none;cursor:crosshair;border:1px solid var(--line)}
  .hint{font-size:12px;color:var(--muted);margin:10px 0 12px}
  button{font:inherit;font-size:13px;padding:7px 16px;border-radius:8px;
    border:1px solid var(--line);background:#fff;color:var(--text);cursor:pointer}
  button:hover{background:#f0f1f3}
  .pred{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  #digit{font-size:46px;font-weight:600;line-height:1;color:var(--accent);min-width:52px}
  #conf{font-size:13px;color:var(--muted)}
  .bars{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .bar-row{display:grid;grid-template-columns:18px 1fr 44px;align-items:center;gap:8px;font-size:12px}
  .bar-track{height:14px;background:#f0f1f3;border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;width:0;background:#b5d4f4;border-radius:4px;transition:width .12s linear}
  .bar-row.top .bar-fill{background:var(--accent)}
  .bar-row.top{font-weight:600}
  .bar-val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar-row.top .bar-val{color:var(--accent)}
  .preview{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:14px}
  #preview{width:84px;height:84px;image-rendering:pixelated;border-radius:6px;background:#000}
  .preview p{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>手写数字识别 · MLP 实时测试</h1>
    <p>两层全连接网络（784 → <span id="hidden">?</span> → 10，tanh + softmax），权重由 <code>mnist_mlp.py</code> 导出。<a href="cnn.html">换成 CNN 卷积版 →</a> · <a href="train.html">看 CNN 训练过程逐层可视化 →</a></p>
  </header>

  <main>
    <section class="card">
      <canvas id="board" width="280" height="280"></canvas>
      <div class="hint">按住鼠标（或手指）在黑板上写一个 0~9，松手前一直在实时预测。</div>
      <button id="clear">清空画板</button>
    </section>

    <section class="card">
      <div class="pred">
        <span id="digit">–</span>
        <span id="conf">还没有笔迹</span>
      </div>
      <div class="bars" id="bars"></div>
      <div class="preview">
        <canvas id="preview" width="28" height="28"></canvas>
        <p>模型实际看到的画面<br>裁边 → 等比缩放到 20×20 → 按重心居中到 28×28</p>
      </div>
    </section>
  </main>
</div>

<script src="model.js"></script>
<script>
(function(){
  var M = window.MNIST_MODEL;
  if(!M){ document.getElementById('conf').textContent = '没有找到 model.js，请先运行 mnist_mlp.py 导出模型'; return; }
  var HID = M.arch[1], IN = M.arch[0], OUT = M.arch[2];
  document.getElementById('hidden').textContent = HID;

  var board = document.getElementById('board');
  var ctx = board.getContext('2d');
  var prev = document.getElementById('preview');
  var pctx = prev.getContext('2d');

  var small = document.createElement('canvas');
  small.width = 28; small.height = 28;
  var sctx = small.getContext('2d', {willReadFrequently:true});

  function clearBoard(){
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, 28 * 10, 28 * 10);
    update();
  }

  var drawing = false, lastX = 0, lastY = 0, pending = false;

  function pos(e){
    var r = board.getBoundingClientRect();
    return {x:(e.clientX - r.left) * board.width / r.width,
            y:(e.clientY - r.top) * board.height / r.height};
  }

  function stroke(x0, y0, x1, y1){
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 17;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  board.addEventListener('pointerdown', function(e){
    drawing = true;
    board.setPointerCapture(e.pointerId);
    var p = pos(e);
    lastX = p.x; lastY = p.y;
    stroke(p.x, p.y, p.x + 0.01, p.y + 0.01);
    schedule();
  });

  board.addEventListener('pointermove', function(e){
    if(!drawing) return;
    var p = pos(e);
    stroke(lastX, lastY, p.x, p.y);
    lastX = p.x; lastY = p.y;
    schedule();
  });

  function stop(e){
    if(!drawing) return;
    drawing = false;
    update();
  }
  board.addEventListener('pointerup', stop);
  board.addEventListener('pointercancel', stop);
  document.getElementById('clear').addEventListener('click', function(){ clearBoard(); });

  function schedule(){
    if(pending) return;
    pending = true;
    requestAnimationFrame(function(){ pending = false; update(); });
  }

  // 把 280×280 的画板缩到 28×28，得到墨迹强度 0~255
  function readInk(){
    sctx.fillStyle = '#fff';
    sctx.fillRect(0, 0, 28, 28);
    sctx.drawImage(board, 0, 0, 28, 28);
    var d = sctx.getImageData(0, 0, 28, 28).data;
    var ink = new Float32Array(784);
    for(var i = 0; i < 784; i++){
      ink[i] = 255 - d[i * 4];   // 白底黑字 -> 墨迹越浓值越大
    }
    return ink;
  }

  // 双线性缩放一块一维存放的二维数组
  function resizeCrop(src, sw, sh, dw, dh){
    var out = new Float32Array(dw * dh);
    for(var y = 0; y < dh; y++){
      var fy = (y + 0.5) * sh / dh - 0.5;
      var y0 = Math.max(0, Math.floor(fy)), y1 = Math.min(sh - 1, y0 + 1);
      var wy = Math.min(1, Math.max(0, fy - y0));
      for(var x = 0; x < dw; x++){
        var fx = (x + 0.5) * sw / dw - 0.5;
        var x0 = Math.max(0, Math.floor(fx)), x1 = Math.min(sw - 1, x0 + 1);
        var wx = Math.min(1, Math.max(0, fx - x0));
        var a = src[y0 * sw + x0] * (1 - wx) + src[y0 * sw + x1] * wx;
        var b = src[y1 * sw + x0] * (1 - wx) + src[y1 * sw + x1] * wx;
        out[y * dw + x] = a * (1 - wy) + b * wy;
      }
    }
    return out;
  }

  // 复刻 MNIST 的预处理：裁到墨迹边界 -> 长边缩到 20 -> 重心对齐到 28×28 中心
  function preprocess(ink){
    var minX = 28, minY = 28, maxX = -1, maxY = -1;
    for(var y = 0; y < 28; y++){
      for(var x = 0; x < 28; x++){
        if(ink[y * 28 + x] > 30){
          if(x < minX) minX = x; if(x > maxX) maxX = x;
          if(y < minY) minY = y; if(y > maxY) maxY = y;
        }
      }
    }
    if(maxX < 0) return null;

    var w = maxX - minX + 1, h = maxY - minY + 1;
    var s = 20 / Math.max(w, h);
    var tw = Math.max(1, Math.round(w * s)), th = Math.max(1, Math.round(h * s));

    var crop = new Float32Array(w * h);
    for(var yy = 0; yy < h; yy++){
      for(var xx = 0; xx < w; xx++){
        crop[yy * w + xx] = ink[(yy + minY) * 28 + (xx + minX)];
      }
    }
    var sm = resizeCrop(crop, w, h, tw, th);

    var mass = 0, cx = 0, cy = 0;
    for(var j = 0; j < th; j++){
      for(var i = 0; i < tw; i++){
        var v = sm[j * tw + i];
        mass += v; cx += v * i; cy += v * j;
      }
    }
    if(mass <= 0) return null;
    cx /= mass; cy /= mass;

    var offX = Math.round(14 - cx), offY = Math.round(14 - cy);
    var out = new Float32Array(784);
    for(var jj = 0; jj < th; jj++){
      for(var ii = 0; ii < tw; ii++){
        var X = ii + offX, Y = jj + offY;
        if(X >= 0 && X < 28 && Y >= 0 && Y < 28) out[Y * 28 + X] = sm[jj * tw + ii];
      }
    }
    return out;
  }

  function infer(x){                    // x: 784 个 0~1
    var W1 = M.W1, b1 = M.b1, W2 = M.W2, b2 = M.b2;
    var hid = new Float32Array(HID);
    for(var j = 0; j < HID; j++){
      var s = b1[j];
      for(var i = 0; i < IN; i++){
        var xi = x[i];
        if(xi > 0) s += xi * W1[i][j];
      }
      hid[j] = Math.tanh(s);
    }
    var logits = new Float32Array(OUT), mx = -Infinity;
    for(var k = 0; k < OUT; k++){
      var t = b2[k];
      for(var j2 = 0; j2 < HID; j2++) t += hid[j2] * W2[j2][k];
      logits[k] = t;
      if(t > mx) mx = t;
    }
    var sum = 0, probs = new Float32Array(OUT);
    for(var k2 = 0; k2 < OUT; k2++){ probs[k2] = Math.exp(logits[k2] - mx); sum += probs[k2]; }
    for(var k3 = 0; k3 < OUT; k3++) probs[k3] /= sum;
    return probs;
  }

  var barsEl = document.getElementById('bars');
  var rows = [];
  for(var d = 0; d < 10; d++){
    var row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = '<span>' + d + '</span>' +
      '<span class="bar-track"><span class="bar-fill"></span></span>' +
      '<span class="bar-val">0%</span>';
    barsEl.appendChild(row);
    rows.push({el:row, fill:row.querySelector('.bar-fill'), val:row.querySelector('.bar-val')});
  }

  function drawPreview(arr){
    var img = pctx.createImageData(28, 28);
    for(var i = 0; i < 784; i++){
      var v = Math.max(0, Math.min(255, Math.round(arr[i])));
      img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
    }
    pctx.putImageData(img, 0, 0);
  }

  function update(){
    var ink = readInk();
    var arr = preprocess(ink);
    var digitEl = document.getElementById('digit');
    var confEl = document.getElementById('conf');

    if(!arr){
      digitEl.textContent = '–';
      confEl.textContent = '还没有笔迹';
      rows.forEach(function(r){ r.fill.style.width = '0%'; r.val.textContent = '0%'; r.el.classList.remove('top'); });
      pctx.fillStyle = '#000'; pctx.fillRect(0, 0, 28, 28);
      return;
    }

    drawPreview(arr);

    var x = new Float32Array(784);
    for(var i = 0; i < 784; i++) x[i] = arr[i] / 255;

    var probs = infer(x);
    var best = 0;
    for(var k = 1; k < 10; k++) if(probs[k] > probs[best]) best = k;

    digitEl.textContent = best;
    confEl.textContent = '置信度 ' + (probs[best] * 100).toFixed(1) + '%';

    for(var d = 0; d < 10; d++){
      var p = probs[d];
      rows[d].fill.style.width = (p * 100).toFixed(1) + '%';
      rows[d].val.textContent = (p * 100).toFixed(0) + '%';
      rows[d].el.classList.toggle('top', d === best && p > 0.05);
    }
  }

  clearBoard();
})();
</script>
</body>
</html>
