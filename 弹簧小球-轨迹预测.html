<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>弹簧振子 · 神经网络轨迹预测</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.panel{position:fixed;border-radius:8px;font-size:12px}
.info{top:8px;left:8px;padding:8px 10px;background:rgba(0,0,0,.62);min-width:246px;line-height:1.55}
.line{display:flex;justify-content:space-between;gap:10px}
.line b{font-weight:400;color:#93a0a8;white-space:nowrap}
.line span{font-variant-numeric:tabular-nums;color:#fff;white-space:nowrap}
.sep{height:1px;background:rgba(255,255,255,.12);margin:5px 0}
.warn span,.warn b{color:#f5b13d}
.legend{display:flex;gap:14px;color:#8e9aa3;font-size:11px;padding-top:2px;flex-wrap:wrap}
.legend i{display:inline-block;width:16px;height:0;border-top-width:2px;vertical-align:middle;margin-right:4px}
.sw-real{border-top:2px solid #2f8f5b}
.sw-true{border-top:2px solid rgba(104,220,163,.45)}
.sw-pred{border-top:2px dashed #f5b13d}
#reset{position:fixed;top:8px;right:8px;z-index:2;padding:6px 10px;background:#222;color:#fff;border:1px solid #666;border-radius:6px;font-size:12px}
.ctrl{bottom:14px;left:12px;right:12px;padding:10px 12px;background:rgba(20,20,20,.84);display:flex;flex-direction:column;gap:7px;font-size:12.5px;max-height:52vh;overflow:auto}
.row{display:flex;align-items:center;gap:8px}
.row>label{white-space:nowrap;min-width:118px}
input[type=range]{flex:1;height:16px;accent-color:#7cf}
.val{min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.toggles{flex-wrap:wrap;gap:6px 16px;margin-top:2px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1)}
.toggles label{display:flex;align-items:center;gap:5px;cursor:pointer;color:#b6c6cf}
input[type=checkbox]{accent-color:#7cf}
#err{position:fixed;top:48px;left:12px;right:12px;z-index:3;padding:10px;border-radius:6px;background:#4a1b0c;color:#f5c4b3;font-size:12px;display:none;line-height:1.5}
@media (max-width:560px){
  .info{min-width:0;padding:6px 8px;font-size:11px;max-width:66vw}
  .row>label{min-width:86px;font-size:11.5px}
  .val{min-width:56px}
}
</style>
</head>
<body>
<div id="app">
  <canvas ref="cv" @pointerdown="down" @pointermove="move" @pointerup="up" @pointercancel="up"></canvas>

  <div id="err"></div>

  <div class="panel info">
    <div class="line" v-for="[l, v] in stats" :key="l"><b>{{ l }}</b><span>{{ v }}</span></div>
    <div class="sep"></div>
    <div class="line" v-for="[l, v] in energy" :key="l"><b>{{ l }}</b><span>{{ v }}</span></div>
    <div class="sep"></div>
    <div class="line"><b>阻尼比 ζ</b><span>{{ dyn.zeta }} {{ dyn.regime }}</span></div>
    <div class="line"><b>振荡周期 T</b><span>{{ dyn.T }}</span></div>
    <div class="sep"></div>
    <div class="line"><b>网络</b><span>{{ nn.arch }}</span></div>
    <div class="line"><b>单步 RMSE</b><span>{{ nn.rmse }}</span></div>
    <div class="line" :class="{warn: predWarn}"><b>预测</b><span>{{ predLabel }}</span></div>
    <div class="line"><b>末端偏差</b><span>{{ predErr }}</span></div>
    <div class="sep"></div>
    <div class="legend">
      <span><i class="sw-real"></i>真实运动</span>
      <span><i class="sw-true"></i>真实未来</span>
      <span><i class="sw-pred"></i>网络预测</span>
    </div>
  </div>

  <button id="reset" @click="reset">重置</button>

  <div class="panel ctrl" ref="ctrlEl">
    <div class="row" v-for="p in params" :key="p.key">
      <label>{{ p.label }} <i style="color:#7a8;font-style:normal">{{ p.unit }}</i></label>
      <input type="range" v-model.number="cfg[p.key]" :min="p.min" :max="p.max" :step="p.step">
      <span class="val">{{ p.fmt(cfg[p.key]) }}</span>
    </div>
    <div class="row">
      <label>预测时域 <i style="color:#7a8;font-style:normal">τ</i></label>
      <input type="range" v-model.number="cfg.horizon" :min="4" :max="24" :step="1">
      <span class="val">{{ horizonText }}</span>
    </div>
    <div class="row toggles">
      <label><input type="checkbox" v-model="cfg.arrows">力矢量</label>
      <label><input type="checkbox" v-model="cfg.showPred">显示预测</label>
      <label><input type="checkbox" v-model="cfg.freeze">冻结预测起点</label>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script>window.Vue||document.write('<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"><\/script>');</script>

<!-- 模型权重：由 spring_dl/train.py 导出。普通 script，file:// 下也能加载。 -->
<script src="spring_model.js"></script>

<script>
/* ============================================================================
 * SpringPredict —— 模型加载与前向推理（纯 JS，无依赖）
 * 格式 spring-mlp-v1，接口约定见 README-轨迹预测.md
 * ==========================================================================*/
const SpringPredict = (function () {
  'use strict';

  function decodeW(layer) {
    // spec 里的 W 是 [in][out] 嵌套数组，这里转成 [out][in] 的连续数组，
    // 让内层循环对权重是顺序访问。
    const W = new Float32Array(layer.out * layer.in);
    for (let o = 0; o < layer.out; o++) {
      for (let i = 0; i < layer.in; i++) W[o * layer.in + i] = layer.W[i][o];
    }
    return { W, b: Float32Array.from(layer.b), nIn: layer.in, nOut: layer.out };
  }

  function fromSpec(spec) {
    if (!spec || !spec.layers || !spec.norm) throw new Error('模型文件缺少 layers / norm 字段');
    const layers = spec.layers.map(decodeW);
    const xm = Float32Array.from(spec.norm.xMean);
    const xs = Float32Array.from(spec.norm.xStd);
    const ym = Float32Array.from(spec.norm.yMean);
    const ys = Float32Array.from(spec.norm.yStd);
    const nF = xm.length;                       // 特征维数由模型文件决定，不写死
    const dtau = (spec.integrator && spec.integrator.dtau) || 0.04;
    const minR = (spec.validity && spec.validity.minRadius) || 0.18;
    const maxR = (spec.validity && spec.validity.maxRadius) || 6.0;

    let maxW = nF;
    for (const l of layers) maxW = Math.max(maxW, l.nIn, l.nOut);
    const f = new Float32Array(nF);             // 原始特征
    const z = new Float32Array(maxW);           // 归一化后的激活
    const h = new Float32Array(maxW);           // 下一层缓冲
    const y = new Float32Array(2);
    const last = layers.length - 1;

    /** 内部用：写入共享输出缓冲 y，避免 RK4 里每步都分配对象。
     *  特征顺序：Rx, Ry, Vx, Vy, logζ, logγ, |R|, 1/|R| */
    function accelInto(Rx, Ry, Vx, Vy, zeta, gamma) {
      const L = Math.max(Math.hypot(Rx, Ry), 1e-6);
      f[0] = Rx; f[1] = Ry; f[2] = Vx; f[3] = Vy;
      f[4] = Math.log(Math.max(zeta, 0.02));          // 与训练时的下限一致
      f[5] = Math.log(Math.max(gamma, 1e-4));
      f[6] = L; f[7] = 1 / L;
      for (let i = 0; i < nF; i++) z[i] = (f[i] - xm[i]) / xs[i];

      let src = z, dst = h;
      for (let li = 0; li < layers.length; li++) {
        const { W, b, nIn, nOut } = layers[li];
        for (let o = 0; o < nOut; o++) {
          let s = b[o];
          const base = o * nIn;
          for (let i = 0; i < nIn; i++) s += src[i] * W[base + i];
          dst[o] = li === last ? s : s / (1 + Math.exp(-s));   // SiLU
        }
        const t = src; src = dst; dst = t;
      }
      y[0] = src[0] * ys[0] + ym[0];
      y[1] = src[1] * ys[1] + ym[1];
      return y;
    }

    /** 对外接口：返回新数组，调用方可安全持有 */
    function accel(Rx, Ry, Vx, Vy, zeta, gamma) {
      const a = accelInto(Rx, Ry, Vx, Vy, zeta, gamma);
      return [a[0], a[1]];
    }

    function rk4(Rx, Ry, Vx, Vy, hh, zeta, gamma) {
      let a = accelInto(Rx, Ry, Vx, Vy, zeta, gamma);
      const a1x = a[0], a1y = a[1];
      a = accelInto(Rx + Vx * hh / 2, Ry + Vy * hh / 2, Vx + a1x * hh / 2, Vy + a1y * hh / 2, zeta, gamma);
      const a2x = a[0], a2y = a[1];
      a = accelInto(Rx + (Vx + a1x * hh / 2) * hh / 2, Ry + (Vy + a1y * hh / 2) * hh / 2,
                    Vx + a2x * hh / 2, Vy + a2y * hh / 2, zeta, gamma);
      const a3x = a[0], a3y = a[1];
      a = accelInto(Rx + (Vx + a2x * hh / 2) * hh, Ry + (Vy + a2y * hh / 2) * hh,
                    Vx + a3x * hh, Vy + a3y * hh, zeta, gamma);
      const a4x = a[0], a4y = a[1];
      return [
        Rx + hh / 6 * (Vx + 2 * (Vx + a1x * hh / 2) + 2 * (Vx + a2x * hh / 2) + (Vx + a3x * hh)),
        Ry + hh / 6 * (Vy + 2 * (Vy + a1y * hh / 2) + 2 * (Vy + a2y * hh / 2) + (Vy + a3y * hh)),
        Vx + hh / 6 * (a1x + 2 * a2x + 2 * a3x + a4x),
        Vy + hh / 6 * (a1y + 2 * a2y + 2 * a3y + a4y),
      ];
    }

    /**
     * 分段推进的积分器。前端每帧只推几十步，
     * 避免一次性算完 300 步占住主线程（实测整条一次算约 32 ms）。
     * 返回对象自带 points：每次 advance 都会往里追加，所以随时可整体读取。
     */
    function stepper(state, params, opt) {
      opt = opt || {};
      const k = params.k, mm = params.m, cc = params.c, gg = params.g, L0 = params.L0;
      const w0 = Math.sqrt(k / mm);
      const zeta = cc / (2 * Math.sqrt(k * mm));
      const gamma = mm * gg / (k * L0);
      const horizon = opt.horizon || 12;
      const n = Math.max(1, Math.round(horizon / dtau));

      let Rx = state.x / L0, Ry = state.y / L0;
      let Vx = state.vx / (L0 * w0), Vy = state.vy / (L0 * w0);
      const points = [];
      let i = 0;

      const api = {
        points, dtau, omega0: w0, zeta, gamma, horizon,
        done: false, ok: true, reason: null,
        advance(maxSteps) {
          const out = [];
          if (api.done) return out;
          if (points.length === 0) {
            const p0 = { tau: 0, x: Rx * L0, y: Ry * L0, vx: Vx * L0 * w0, vy: Vy * L0 * w0 };
            points.push(p0); out.push(p0);
          }
          for (let s = 0; s < maxSteps; s++) {
            if (Math.hypot(Rx, Ry) < minR || Math.hypot(Rx, Ry) > maxR) {
              api.ok = false;
              api.reason = '|R| 越出训练范围 [' + minR + ', ' + maxR + ']，停止外推';
              api.done = true;
              break;
            }
            if (i >= n) { api.done = true; break; }
            [Rx, Ry, Vx, Vy] = rk4(Rx, Ry, Vx, Vy, dtau, zeta, gamma);
            i++;
            const p = { tau: i * dtau, x: Rx * L0, y: Ry * L0, vx: Vx * L0 * w0, vy: Vy * L0 * w0 };
            points.push(p); out.push(p);
            if (i >= n) { api.done = true; break; }
          }
          return out;
        },
      };
      return api;
    }

    /** 一次性算完整条轨迹（约定接口，适合离线分析/服务端使用） */
    function rollout(state, params, opt) {
      const sp = stepper(state, params, opt);
      sp.advance(1e9);
      return { points: sp.points, ok: sp.ok, reason: sp.reason, dtau: sp.dtau,
               omega0: sp.omega0, zeta: sp.zeta, gamma: sp.gamma, horizon: sp.horizon };
    }

    return { accel, rollout, stepper, spec, dtau, minR, maxR,
             params: layers.reduce((s, l) => s + l.W.length + l.b.length, 0) };
  }

  /** 优先用 window.SPRING_MODEL（file:// 可用），其次 fetch 同目录 JSON。 */
  async function load(url) {
    let spec = window.SPRING_MODEL;
    if (!spec && url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error('无法加载模型：HTTP ' + r.status);
      spec = await r.json();
    }
    if (!spec) throw new Error('未找到模型：请确认 spring_model.js 与页面同目录');
    return fromSpec(spec);
  }

  return { load, fromSpec };
})();
</script>

<script>
if (!window.Vue) {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'Vue 加载失败：请检查网络，或把 vue.global.prod.js 放到同目录后改成本地引用。';
  throw new Error('Vue not loaded');
}
const { createApp, reactive, ref, computed, onMounted, onUnmounted } = Vue;

// ===== 场景与世界常量 =====
const SCALE = 0.01;          // 1 px = 0.01 m
const H_STEP = 1 / 240;      // 固定物理步长
const MAX_LAG = 0.10;
const BALL_R = 14, HIT_R = 22, COILS = 8;
const FIELDS = ['x', 'y', 'vx', 'vy'];
const F_SCALE = 8, F_MAX = 200;
const V_MAX = 3000;
const PRED_CHUNK = 30;       // 每帧推进的积分子步数（分片计算，避免卡帧）

createApp({
  setup() {
    const cv = ref(null), ctrlEl = ref(null);
    let ctx, W = 0, H = 0, raf = 0, lastT = 0, lag = 0, drag = false, samples = [];
    let anchor = { x: 0, y: 0 };
    let s = { x: 0, y: 0, vx: 0, vy: 0 };
    let acc = { ax: 0, ay: 0 };
    let F = { sx: 0, sy: 0, dx: 0, dy: 0, gy: 0 };
    let simT = 0;
    let predictor = null, pred = null, sp = null, spT0 = 0;

    const cfg = reactive({
      k: 7, m: 1, damp: 0.12, g: 9.8, L0: 1,
      arrows: true, horizon: 12, showPred: true, freeze: false,
    });
    const params = [
      { key: 'k',    label: '弹簧刚度 k', unit: 'N/m',   min: 2,  max: 20, step: 0.2,  fmt: v => v.toFixed(1) },
      { key: 'm',    label: '质量 m',     unit: 'kg',    min: 0.2, max: 3, step: 0.1,  fmt: v => v.toFixed(1) },
      { key: 'damp', label: '阻尼系数 c', unit: 'N·s/m', min: 0,  max: 20, step: 0.05, fmt: v => v.toFixed(2) },
      { key: 'g',    label: '重力 g',     unit: 'm/s²',  min: 0,  max: 20, step: 0.2,  fmt: v => v.toFixed(1) },
      { key: 'L0',   label: '原长 L0',    unit: 'm',     min: 0.2, max: 1.8, step: 0.05, fmt: v => v.toFixed(2) },
    ];

    const dyn = computed(() => {
      const w0 = Math.sqrt(cfg.k / cfg.m), cc = 2 * cfg.m * w0, z = cfg.damp / cc;
      const wd = w0 * Math.sqrt(Math.max(0, 1 - z * z));
      return {
        zeta: z.toFixed(3),
        regime: z < 0.995 ? '欠阻尼' : (z < 1.005 ? '临界' : '过阻尼'),
        cc: cc.toFixed(2) + ' N·s/m',
        T: z < 1 ? (2 * Math.PI / wd).toFixed(2) + ' s' : '— 不振荡',
        omega0: w0,
      };
    });

    const horizonText = computed(() => (cfg.horizon / dyn.value.omega0).toFixed(1) + ' s');

    // ===== 微分方程（无空气阻力、无地面碰撞）=====
    const deriv = (u) => {
      const dx = u.x - anchor.x, dy = u.y - anchor.y;
      const len = Math.hypot(dx, dy) || 1e-9;
      const ex = dx / len, ey = dy / len;
      const vx = u.vx * SCALE, vy = u.vy * SCALE;
      const fs = -cfg.k * (len * SCALE - cfg.L0);
      const fx = fs * ex - cfg.damp * vx;
      const fy = fs * ey - cfg.damp * vy + cfg.m * cfg.g;
      F = { sx: fs * ex, sy: fs * ey, dx: -cfg.damp * vx, dy: -cfg.damp * vy, gy: cfg.m * cfg.g };
      const ax = fx / cfg.m / SCALE, ay = fy / cfg.m / SCALE;
      acc = { ax, ay };
      return { x: u.vx, y: u.vy, vx: ax, vy: ay };
    };

    const step = (u, d, h) => Object.fromEntries(FIELDS.map(f => [f, u[f] + d[f] * h]));
    const rk4 = (u, dt) => {
      const k1 = deriv(u);
      const k2 = deriv(step(u, k1, dt / 2));
      const k3 = deriv(step(u, k2, dt / 2));
      const k4 = deriv(step(u, k3, dt));
      return Object.fromEntries(FIELDS.map(f => [f, u[f] + dt / 6 * (k1[f] + 2 * k2[f] + 2 * k3[f] + k4[f])]));
    };

    const advance = (dt) => {
      lag = Math.min(lag + dt, MAX_LAG);
      while (lag >= H_STEP) { s = rk4(s, H_STEP); simT += H_STEP; lag -= H_STEP; }
    };

    // ===== 真实未来轨迹（解析向量场，用于对照）=====
    const trueFuture = (seed, n, dtau, zeta, gamma, L0, w0) => {
      let [Rx, Ry, Vx, Vy] = seed;
      const pts = [{ x: Rx * L0, y: Ry * L0 }];
      const f = (rx, ry, vx, vy) => {
        const L = Math.max(Math.hypot(rx, ry), 1e-9);
        return [-(L - 1) * rx / L - 2 * zeta * vx,
                -(L - 1) * ry / L - 2 * zeta * vy + gamma];
      };
      for (let i = 1; i <= n; i++) {
        const a1 = f(Rx, Ry, Vx, Vy);
        const a2 = f(Rx + Vx * dtau / 2, Ry + Vy * dtau / 2, Vx + a1[0] * dtau / 2, Vy + a1[1] * dtau / 2);
        const a3 = f(Rx + (Vx + a1[0] * dtau / 2) * dtau / 2, Ry + (Vy + a1[1] * dtau / 2) * dtau / 2,
                    Vx + a2[0] * dtau / 2, Vy + a2[1] * dtau / 2);
        const a4 = f(Rx + (Vx + a2[0] * dtau / 2) * dtau, Ry + (Vy + a2[1] * dtau / 2) * dtau,
                    Vx + a3[0] * dtau, Vy + a3[1] * dtau);
        Rx = Rx + dtau / 6 * (Vx + 2 * (Vx + a1[0] * dtau / 2) + 2 * (Vx + a2[0] * dtau / 2) + (Vx + a3[0] * dtau));
        Ry = Ry + dtau / 6 * (Vy + 2 * (Vy + a1[1] * dtau / 2) + 2 * (Vy + a2[1] * dtau / 2) + (Vy + a3[1] * dtau));
        Vx = Vx + dtau / 6 * (a1[0] + 2 * a2[0] + 2 * a3[0] + a4[0]);
        Vy = Vy + dtau / 6 * (a1[1] + 2 * a2[1] + 2 * a3[1] + a4[1]);
        pts.push({ x: Rx * L0, y: Ry * L0 });
      }
      return pts;
    };

    // ===== 预测 =====
    const predLabel = ref('—');
    const predErr = ref('—');
    const predWarn = ref(false);

    const currentKey = () => [cfg.k, cfg.m, cfg.damp, cfg.g, cfg.L0, cfg.horizon].join('|');
    const siState = () => ({
      x: (s.x - anchor.x) * SCALE, y: (s.y - anchor.y) * SCALE,
      vx: s.vx * SCALE, vy: s.vy * SCALE,
    });

    const newStepper = () => {
      const st = siState();
      const pk = { k: cfg.k, m: cfg.m, c: cfg.damp, g: cfg.g, L0: cfg.L0 };
      sp = predictor.stepper(st, pk, { horizon: cfg.horizon });
      spT0 = simT;
      const w0 = Math.sqrt(pk.k / pk.m);
      sp._seed = [st.x / pk.L0, st.y / pk.L0, st.vx / (pk.L0 * w0), st.vy / (pk.L0 * w0)];
      sp._key = currentKey();
      sp._L0 = pk.L0;
    };

    const commit = () => {
      const n = sp.points.length - 1;
      pred = {
        points: sp.points, ok: sp.ok, reason: sp.reason, dtau: sp.dtau,
        omega0: sp.omega0, t0: spT0, frozen: cfg.freeze, key: sp._key,
        truth: sp.ok ? trueFuture(sp._seed, n, sp.dtau, sp.zeta, sp.gamma, sp._L0, sp.omega0) : null,
      };
      if (pred.truth && pred.truth.length === pred.points.length) {
        const a = pred.points[n], b = pred.truth[n];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        predErr.value = (d * 100).toFixed(d < 0.1 ? 2 : 1) + ' cm';
      } else {
        predErr.value = '—';
      }
      predWarn.value = !pred.ok;
      const secs = n * pred.dtau / pred.omega0;
      predLabel.value = !pred.ok ? '越界 ' + secs.toFixed(1) + ' s'
                                 : (cfg.freeze ? '锁定 ' : '滚动 ') + secs.toFixed(1) + ' s';
      sp = null;
    };

    const updatePrediction = () => {
      if (!predictor || !cfg.showPred || drag) return;
      const key = currentKey();
      try {
        if (cfg.freeze) {
          if (!pred || !pred.frozen || pred.key !== key) {
            newStepper();
            sp.advance(1e9);
            commit();
          }
          return;
        }
        if (pred && pred.frozen) { pred = null; sp = null; }
        if (!sp || sp._key !== key) newStepper();
        sp.advance(PRED_CHUNK);
        if (sp.done) { commit(); newStepper(); }
      } catch (e) {
        // 任何推理异常都不该拖垮整个动画循环，降级成"只显示仿真"
        cfg.showPred = false;
        predLabel.value = '推理异常';
        predWarn.value = true;
        console.error('[SpringPredict]', e);
      }
    };

    // ===== 绘制 =====
    const dot = (x, y, r, fill, stroke) => {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = fill; ctx.fill();
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
    };

    const drawSpring = () => {
      const dx = s.x - anchor.x, dy = s.y - anchor.y, len = Math.hypot(dx, dy);
      if (len < 2) return;
      const ex = dx / len, ey = dy / len, nx = -ey, ny = ex;
      const lead = Math.min(20, len * 0.18), body = len - 2 * lead, amp = 10;
      ctx.beginPath();
      ctx.moveTo(anchor.x, anchor.y);
      ctx.lineTo(anchor.x + ex * lead, anchor.y + ey * lead);
      for (let i = 0, N = 192; i <= N; i++) {
        const t = i / N;
        const o = Math.sin(t * Math.PI * 2 * COILS) * amp * Math.pow(Math.sin(Math.PI * t), 0.35);
        const d = lead + body * t;
        ctx.lineTo(anchor.x + ex * d + nx * o, anchor.y + ey * d + ny * o);
      }
      ctx.lineTo(s.x, s.y);
      ctx.strokeStyle = '#7cf'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();
    };

    const arrow = (fx, fy, color, label, side = 0) => {
      const m = Math.hypot(fx, fy);
      if (m * F_SCALE < 10) return;
      const ux = fx / m, uy = fy / m, off = 22 * side;
      const ox = s.x - uy * off, oy = s.y + ux * off;
      const k = Math.min(F_SCALE, F_MAX / m);
      const x2 = ox + fx * k, y2 = oy + fy * k, a = Math.atan2(fy, fx);
      if (side) {
        ctx.save();
        ctx.setLineDash([2, 3]); ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(ox, oy); ctx.stroke();
        ctx.restore();
      }
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - 9 * Math.cos(a - 0.45), y2 - 9 * Math.sin(a - 0.45));
      ctx.lineTo(x2 - 9 * Math.cos(a + 0.45), y2 - 9 * Math.sin(a + 0.45));
      ctx.fill();
      ctx.font = '11px system-ui';
      const lx = x2 + ux * 6 + 3, ly = y2 + uy * 6 + 4;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.75)';
      ctx.strokeText(label, lx, ly); ctx.fillText(label, lx, ly);
    };

    const toPx = p => [anchor.x + p.x / SCALE, anchor.y + p.y / SCALE];

    const drawPred = () => {
      if (!cfg.showPred || !pred) return;
      const pts = pred.points;
      if (pts.length < 2) return;

      if (pred.truth && pred.truth.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(104,220,163,.45)';
        ctx.lineWidth = 1.2;
        pred.truth.forEach((p, i) => {
          const [X, Y] = toPx(p);
          i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
        });
        ctx.stroke();
      }

      ctx.save();
      ctx.setLineDash([7, 6]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#f5b13d';
      ctx.beginPath();
      pts.forEach((p, i) => {
        const [X, Y] = toPx(p);
        i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      });
      ctx.stroke();
      ctx.setLineDash([]);

      const [ex, ey] = toPx(pts[pts.length - 1]);
      ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI * 2);
      ctx.strokeStyle = '#f5b13d'; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.fillStyle = 'rgba(245,177,61,.18)'; ctx.fill();
      ctx.restore();

      if (cfg.freeze) {
        const dtReal = pred.dtau / pred.omega0;
        const idx = Math.max(0, Math.min(pts.length - 1, Math.round((simT - pred.t0) / dtReal)));
        const [qx, qy] = toPx(pts[idx]);
        ctx.save();
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = 'rgba(245,177,61,.8)';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(qx, qy); ctx.stroke();
        ctx.restore();
        ctx.beginPath(); ctx.arc(qx, qy, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#f5b13d'; ctx.fill();
      }
    };

    const draw = () => {
      ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);

      const eqY = anchor.y + (cfg.L0 + cfg.m * cfg.g / cfg.k) / SCALE;
      if (eqY < H) {
        ctx.save();
        ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(anchor.x - 80, eqY); ctx.lineTo(anchor.x + 80, eqY); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.font = '11px system-ui';
        ctx.fillText('平衡位置', anchor.x + 86, eqY + 4);
        ctx.restore();
      }

      drawPred();
      drawSpring();
      dot(anchor.x, anchor.y, 6, '#fa4');

      const g = ctx.createRadialGradient(s.x - BALL_R * .35, s.y - BALL_R * .35, BALL_R * .2, s.x, s.y, BALL_R);
      g.addColorStop(0, '#b6f5cf'); g.addColorStop(1, '#2f8f5b');
      dot(s.x, s.y, BALL_R, g, '#fff');

      if (cfg.arrows) {
        arrow(F.sx, F.sy, '#fd6', 'F弹', 1);
        arrow(0, F.gy, '#9cf', 'G', 0);
        arrow(F.dx, F.dy, '#c9f', 'F阻', -1);
      }
    };

    // ===== 读数 =====
    const stats = ref([]), energy = ref([]);
    const nn = reactive({ arch: '未加载', rmse: '—' });

    const updateStats = () => {
      const rx = (s.x - anchor.x) * SCALE, ry = (s.y - anchor.y) * SCALE;
      const v = Math.hypot(s.vx, s.vy) * SCALE, a = Math.hypot(acc.ax, acc.ay) * SCALE;
      const L = Math.hypot(rx, ry);
      stats.value = [
        ['速度 v', v.toFixed(2) + ' m/s'],
        ['加速度 a', a.toFixed(2) + ' m/s²'],
        ['位移 (x, y)', `(${rx.toFixed(2)}, ${ry.toFixed(2)}) m`],
        ['弹簧长度 L', L.toFixed(2) + ' m'],
      ];
      const Ek = 0.5 * cfg.m * v * v;
      const Es = 0.5 * cfg.k * (L - cfg.L0) ** 2;
      const Ep = -cfg.m * cfg.g * ry;
      energy.value = [
        ['动能 Ek', Ek.toFixed(2) + ' J'],
        ['弹性势能 Es', Es.toFixed(2) + ' J'],
        ['重力势能 Ep', Ep.toFixed(2) + ' J'],
        ['总机械能 E', (Ek + Es + Ep).toFixed(2) + ' J'],
      ];
    };

    // ===== 尺寸 / 重置 =====
    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const c = cv.value;
      W = window.innerWidth; H = window.innerHeight;
      c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      anchor = { x: W / 2, y: 80 };
    };

    const reset = () => {
      resize();
      // 偏离轴线放置，得到一条二维轨道，同时避开 |r|→0 的方向奇异点
      s = { x: anchor.x + 85, y: anchor.y + 135, vx: 0, vy: 0 };
      lag = 0; drag = false; samples = []; simT = 0;
      pred = null; sp = null;
    };

    // ===== 拖拽 =====
    const down = (e) => {
      if (Math.hypot(e.clientX - s.x, e.clientY - s.y) > HIT_R) return;
      e.target.setPointerCapture(e.pointerId);
      drag = true;
      samples = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
      cv.value.style.cursor = 'grabbing';
    };
    const move = (e) => {
      if (!drag) return;
      s.x = e.clientX; s.y = e.clientY; s.vx = s.vy = 0;
      const t = performance.now();
      samples.push({ x: e.clientX, y: e.clientY, t });
      while (samples.length > 2 && t - samples[0].t > 90) samples.shift();
    };
    const up = (e) => {
      if (!drag) return;
      const t = performance.now();
      samples.push({ x: e.clientX, y: e.clientY, t });
      const ref = samples.find(p => t - p.t <= 90) || samples[0];
      const dt = (t - ref.t) / 1000;
      if (dt > 0.008) {
        let vx = (e.clientX - ref.x) / dt, vy = (e.clientY - ref.y) / dt;
        const spd = Math.hypot(vx, vy);
        if (spd > V_MAX) { vx = vx / spd * V_MAX; vy = vy / spd * V_MAX; }
        s.vx = vx; s.vy = vy;
      }
      drag = false; lag = 0; pred = null; sp = null;
      cv.value.style.cursor = 'grab';
    };

    // ===== 主循环 =====
    const loop = (t) => {
      raf = requestAnimationFrame(loop);
      const dt = Math.min((t - lastT) / 1000, 0.25);
      lastT = t;

      if (drag) { deriv(s); lag = 0; }
      else advance(dt);

      updatePrediction();
      updateStats();
      draw();
    };

    onMounted(async () => {
      ctx = cv.value.getContext('2d');
      reset();
      lastT = performance.now();
      addEventListener('resize', reset);

      try {
        predictor = await SpringPredict.load('spring_model.json');
        const m = predictor.spec.metrics || {};
        nn.arch = predictor.spec.arch.hidden.join('-') + ' · ' + (predictor.params / 1000).toFixed(1) + 'k';
        nn.rmse = m.one_step_rmse ? m.one_step_rmse.toExponential(1) : '—';
      } catch (err) {
        const el = document.getElementById('err');
        el.style.display = 'block';
        el.textContent = '模型未加载：' + err.message + '。画布仍可正常仿真，只是不显示预测虚线。';
        nn.arch = '未加载';
      }

      raf = requestAnimationFrame(loop);
    });
    onUnmounted(() => { cancelAnimationFrame(raf); removeEventListener('resize', reset); });

    return { cv, ctrlEl, cfg, params, dyn, stats, energy, nn, predLabel, predErr, predWarn,
             horizonText, reset, down, move, up };
  }
}).mount('#app');
</script>
</body>
</html>
